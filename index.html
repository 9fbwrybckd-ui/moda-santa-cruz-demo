<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moda Santa Cruz · Catálogo</title>
<meta name="description" content="Ropa en Santa Cruz de la Sierra. Elegí tu talla y pedí por WhatsApp. Envíos a toda Bolivia.">
<meta name="theme-color" content="#f4ede3">
<meta property="og:title" content="Moda Santa Cruz · Catálogo">
<meta property="og:description" content="Elegí tu talla y pedí por WhatsApp. Envíos a toda Bolivia.">
<meta property="og:image" content="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&w=1200&q=70">
<meta property="og:url" content="https://9fbwrybckd-ui.github.io/moda-santa-cruz-demo/">
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4ede3; --paper: #fbf7f1; --ink: #2b1e17; --muted: #75655a; --line: #e2d6c6;
    --accent: #b4502d; --wa: #167a42;
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1); --spring: cubic-bezier(.34,1.35,.64,1);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Instrument Sans", system-ui, sans-serif; }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Portada: el nombre cruza el borde de la foto */
  .hero { position: relative; height: 74svh; min-height: 420px; max-height: 720px; background: var(--line); margin-bottom: 5.5rem; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0005, transparent 22%, transparent 50%, #1a0f0a99); }
  .hero-txt { position: absolute; left: 16px; right: 16px; bottom: -4.6rem; z-index: 1; color: #fff; max-width: 1100px; margin: 0 auto; }
  .hero h1 { font: 400 clamp(56px, 17vw, 112px)/.86 Fraunces, serif; font-variation-settings: "SOFT" 100, "opsz" 144; letter-spacing: -.04em; margin: 0; }
  .hero h1 em { display: block; padding-left: .45em; font-style: italic; font-weight: 300; color: var(--accent); }
  .hero p { color: var(--muted); margin: 12px 0 0; padding-left: .2em; font-size: 15px; }
  .coleccion { position: absolute; top: 20px; left: 12px; z-index: 1; writing-mode: vertical-rl; rotate: 180deg; color: #fff; font: 500 11px/1 "Instrument Sans"; letter-spacing: .2em; text-transform: uppercase; }
  .ejemplo { position: absolute; top: 12px; right: 12px; z-index: 1; font-size: 11px; color: #fff; background: #0006; padding: 3px 8px; border-radius: 6px; }

  .confianza { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; max-width: 1100px; margin: 0 auto; padding: 0 16px 20px; font-size: 13px; color: var(--muted); }
  .confianza a { color: var(--ink); }
  @media (min-width: 700px) { .confianza { grid-template-columns: repeat(4, auto); justify-content: start; gap: 24px; } }

  /* Lo nuevo */
  .nuevo { max-width: 1100px; margin: 0 auto; padding: 8px 0 28px; }
  .sec { font: italic 400 30px/1 Fraunces, serif; text-transform: none; letter-spacing: -.02em; margin: 0 16px 14px; }
  .fila { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 16px; padding: 0 16px; scrollbar-width: none; }
  .mini { flex: 0 0 42%; max-width: 190px; scroll-snap-align: start; display: grid; gap: 2px; color: inherit; text-decoration: none; font-size: 13px; }
  .mini img { width: 100%; height: auto; aspect-ratio: 4/5; object-fit: cover; border-radius: 2px; background: var(--line); }
  .mini b { font: 500 15px Fraunces, serif; }

  /* Categorías como pestañas */
  nav { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; gap: 22px; overflow-x: auto; padding: 0 16px; min-height: 56px; max-width: 1100px; margin: 0 auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav button { border: 0; background: none; padding: 0; min-height: 56px; color: var(--muted); font-size: 15px; white-space: nowrap; box-shadow: inset 0 -2px transparent; transition: color .15s, box-shadow .15s; }
  nav button[aria-pressed="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px var(--accent); }

  main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 10px; padding: 20px 12px 120px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 700px) { main { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 40px 24px; padding-inline: 16px; } }
  article { display: flex; flex-direction: column; gap: 6px; }
  .img { position: relative; aspect-ratio: 3/4; background: var(--line); border-radius: 2px; overflow: hidden; }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s ease-out; }
  .img img:not([data-l]) { opacity: 0; }
  .tag { position: absolute; left: 8px; bottom: 8px; background: var(--paper); color: var(--ink); font: italic 500 13px Fraunces, serif; padding: 2px 8px; }
  .agotado .tag { background: var(--ink); color: var(--paper); }
  .agotado .img img[data-l] { filter: grayscale(1); opacity: .5; }
  h2 { font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; line-height: 1.35; margin: 6px 0 0; }
  .precio { font: 500 19px Fraunces, serif; font-variant-numeric: tabular-nums; }
  .precio small { font: 500 11px "Instrument Sans"; letter-spacing: .08em; color: var(--muted); }
  .tallas { display: flex; gap: 4px; flex-wrap: wrap; }
  .tallas input { position: absolute; opacity: 0; pointer-events: none; }
  .tallas span { display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; font-size: 13px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
  .tallas input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tallas input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
  .add { margin-top: 4px; min-height: 44px; border: 0; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px; }
  .add.ok { background: var(--accent); }
  .avisar { margin-top: 4px; min-height: 44px; display: grid; place-items: center; font-size: 13px; color: var(--ink); border: 1px solid var(--line); text-decoration: none; }

  /* Tarjeta destacada a todo el ancho */
  article.destacado { grid-column: 1/-1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px 14px; align-content: end; padding: 20px 0; border-block: 1px solid var(--line); }
  article.destacado .img { grid-row: 1 / span 5; aspect-ratio: 4/5; }
  article.destacado > :not(.img) { grid-column: 2; }
  article.destacado h2 { font: italic 400 24px/1.05 Fraunces, serif; text-transform: none; letter-spacing: -.01em; }
  @media (min-width: 700px) { article.destacado { grid-column: span 2; } }

  .estado { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 16px; }
  .estado a { color: var(--wa); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { .sk .img { animation: p 1s infinite alternate; } }
  @keyframes p { to { opacity: .45; } }

  /* Barra del pedido: entra con rebote */
  #barra { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3; max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--wa); color: #fff; border: 0; padding: 14px 18px; border-radius: 4px; font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px #0003;
    visibility: hidden; opacity: 0; transition: opacity .2s, visibility 0s .2s, scale .16s var(--ease-out); }
  #barra.on { visibility: visible; opacity: 1; transition-delay: 0s; }
  #barra span { display: inline-block; }

  /* Bolsa: hoja que sube desde abajo */
  dialog { border: 0; border-radius: 14px 14px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); width: 100%; max-width: 520px; margin: auto auto 0; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: #0006; }
  dialog, dialog::backdrop { opacity: 0; transition: opacity .2s, overlay .2s allow-discrete, display .2s allow-discrete; }
  dialog[open], dialog[open]::backdrop { opacity: 1; }
  @starting-style { dialog[open], dialog[open]::backdrop { opacity: 0; } }
  dialog h3 { font: italic 400 30px Fraunces, serif; margin: 0 0 12px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .item img { width: 48px; height: 64px; object-fit: cover; background: var(--line); }
  .item span { flex: 1; }
  .item button { border: 0; background: none; min-width: 44px; min-height: 44px; font-size: 20px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; font-weight: 600; }
  .total span:last-child { font: 500 26px Fraunces, serif; }
  .enviar { width: 100%; min-height: 50px; border: 0; border-radius: 4px; background: var(--wa); color: #fff; font-weight: 600; font-size: 16px; }
  .nota { font-size: 13px; color: var(--muted); text-align: center; margin: 10px 0 0; }
  .cerrar { width: 100%; min-height: 44px; margin-top: 4px; border: 0; background: none; color: var(--muted); }

  /* Respuesta al tocar */
  .add, .enviar, .cerrar, nav button, .item button, .tallas span { transition: scale .16s var(--ease-out), background-color .15s, color .15s, border-color .15s; }
  .add:active, .enviar:active, #barra:active { scale: .97; }
  .tallas label:active span, .item button:active { scale: .92; }

  @media (prefers-reduced-motion: no-preference) {
    #barra { translate: 0 calc(100% + 24px); transition-property: opacity, translate, visibility, scale; transition-duration: .2s, .2s, 0s, .16s; }
    #barra.on { translate: 0; transition-duration: .2s, .42s, 0s, .16s; transition-timing-function: ease, var(--spring), linear, var(--ease-out); }
    dialog { translate: 0 100%; transition-property: opacity, translate, overlay, display; transition-timing-function: var(--ease-drawer); }
    dialog[open] { translate: 0; transition-duration: .32s; }
    @starting-style { dialog[open] { translate: 0 100%; } }
  }

  footer { background: var(--ink); color: #dccfbf; padding: 56px 16px 140px; font-size: 14px; }
  footer p { max-width: 1100px; margin: 0 auto 14px; }
  footer a { color: var(--paper); text-underline-offset: 3px; }
  .pie-nombre { font: italic 300 44px/1 Fraunces, serif; color: var(--paper); }
</style>
</head>
<body>
<header class="hero" id="hero">
  <span class="ejemplo">Fotos de ejemplo</span>
  <span class="coleccion" id="coleccion"></span>
  <div class="hero-txt">
    <h1 id="nombre"></h1>
    <p id="lema"></p>
  </div>
</header>
<div class="confianza" id="confianza"></div>
<section class="nuevo" id="nuevo" hidden><h2 class="sec">Lo nuevo</h2><div class="fila" id="fila"></div></section>
<nav id="filtros" aria-label="Categorías"></nav>
<main id="catalogo" aria-live="polite"></main>
<footer id="pie"></footer>

<button id="barra" type="button" aria-haspopup="dialog"></button>
<dialog id="bolsa" aria-labelledby="tbolsa">
  <h3 id="tbolsa">Tu pedido</h3>
  <div id="items"></div>
  <div class="total"><span>Total</span><span id="total"></span></div>
  <button class="enviar" type="button" id="enviar">Enviar pedido por WhatsApp</button>
  <p class="nota">Se abre WhatsApp con tu pedido listo para enviar.</p>
  <button class="cerrar" type="button" id="cerrar">Seguir viendo</button>
</dialog>

<script>
  // Lo único que cambia de una tienda a otra
  const TIENDA = {
    nombre: "Moda Santa Cruz",
    lema: "Nueva colección · Santa Cruz de la Sierra",
    coleccion: "Primavera 2026",
    whatsapp: "12516430051",          // con código de país, ej. 59170000000
    instagram: "modasantacruz",
    direccion: "Av. San Martín, Equipetrol",
    envios: "Envíos a toda Bolivia",
    delivery: "Delivery en SCZ Bs 15",
    horario: "Lun–Sáb 9:00–20:00",
    // El dueño edita esta hoja de Google; la página lee su versión publicada en CSV
    hoja: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVaUS1cnCyNBkceOIoGh_RS53NkUL2BzYqZ8KGrwtG15SBCZ7WOsnFcn8GWIMAHqbL9sNJ7Ghwv5ki/pub?output=csv",
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const wa = txt => `https://wa.me/${TIENDA.whatsapp}?text=${encodeURIComponent(txt)}`;
  const quieto = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CAMPOS = ["nombre", "categoria", "precio", "tallas", "foto", "disponible", "nuevo"];

  // ponytail: parser CSV mínimo (comillas, comas y saltos de línea entre comillas), suficiente para lo que exporta Google Sheets
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const [head, ...data] = rows.filter(r => r.some(v => v.trim()));
    if (!head) return [];
    // "Categoría", "Precio (Bs)", "TALLAS " → categoria, precio, tallas
    const keys = head.map(h => h.normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().split(/[\s(]/)[0]);
    return data.map(r => {
      const o = Object.fromEntries(keys.map((k, i) => [k, (r[i] || "").trim()]));
      for (const k of CAMPOS) o[k] ??= "";
      return o;
    });
  }

  // El dueño escribe como quiere: "Sí", "SI ", "no", "agotado", vacío = disponible
  const disponible = v => !/^\s*(no|n|0|agotado)\b/i.test(v);
  const esNuevo = v => /^\s*(si|sí|s|x|1|yes|nuevo)\b/i.test(v);

  function limpiar(lista) {
    return lista.filter(p => p.nombre).map(p => {
      const cat = p.categoria.trim();
      return {
        ...p,
        categoria: cat ? cat[0].toUpperCase() + cat.slice(1).toLowerCase() : "Otros",
        precio: p.precio.replace(/^\s*bs\.?\s*/i, ""),
        tallas: p.tallas.split(/[\s,\/]+/).filter(Boolean),
        foto: /^https?:\/\//i.test(p.foto) ? p.foto : "",
        ok: disponible(p.disponible),
        nuevo: esNuevo(p.nuevo),
      };
    }).sort((a, b) => b.ok - a.ok);
  }

  // Fotos más livianas: AVIF/WebP y tamaño justo para 2 columnas en celular
  function img(foto, i, alt, ancho = 400, sizes = "(min-width:700px) 260px, 50vw") {
    if (!foto) return "";
    const u = /images\.unsplash\.com/.test(foto)
      ? w => foto.replace(/([?&])w=\d+/, "$1w=" + w).replace(/([?&])auto=[^&]*&?/, "$1") + (foto.includes("?") ? "&" : "?") + "auto=format"
      : () => foto;
    const carga = i < 2 ? 'fetchpriority="high"' : 'loading="lazy"';
    return `<img src="${esc(u(ancho))}" srcset="${esc(u(ancho))} ${ancho}w, ${esc(u(ancho * 2))} ${ancho * 2}w"
      sizes="${sizes}" width="300" height="400" alt="${esc(alt)}" ${carga} decoding="async" onload="this.dataset.l=1" onerror="this.remove()">`;
  }

  let productos = [], filtro = "Todo", bolsa = [];

  function pintarTienda() {
    document.title = `${TIENDA.nombre} · Catálogo`;
    const [a, ...b] = TIENDA.nombre.split(" ");
    $("nombre").innerHTML = b.length ? `${esc(a)}<em>${esc(b.join(" "))}</em>` : esc(a);
    $("lema").textContent = TIENDA.lema;
    $("coleccion").textContent = TIENDA.coleccion;
    $("confianza").innerHTML = [esc(TIENDA.envios), esc(TIENDA.delivery), esc(TIENDA.horario),
      `<a href="https://instagram.com/${esc(TIENDA.instagram)}" rel="noopener">@${esc(TIENDA.instagram)}</a>`]
      .map(t => `<span>${t}</span>`).join("");
    const dir = `${TIENDA.direccion}, Santa Cruz de la Sierra`;
    $("pie").innerHTML = `<p class="pie-nombre">${esc(TIENDA.nombre)}</p>
      <p>${esc(dir)}<br>${esc(TIENDA.horario)}<br>${esc(TIENDA.envios)}</p>
      <p><a href="${wa("Hola!")}" target="_blank" rel="noopener">WhatsApp</a> · <a href="https://instagram.com/${esc(TIENDA.instagram)}" rel="noopener">Instagram</a> · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}" target="_blank" rel="noopener">Cómo llegar</a></p>`;
  }

  function pintarHero() {
    const p = productos.find(p => p.nuevo && p.ok && p.foto) || productos.find(p => p.foto);
    const h = $("hero"); h.querySelector("img")?.remove();
    if (p) h.insertAdjacentHTML("afterbegin", img(p.foto, 0, "", 900, "100vw").replace(' onload="this.dataset.l=1"', ""));
  }

  function pintarNuevo() {
    const n = productos.map((p, i) => [p, i]).filter(([p]) => p.nuevo && p.ok && p.foto);
    $("nuevo").hidden = n.length < 2;
    $("fila").innerHTML = n.map(([p, i]) => `<a class="mini" href="#p${i}">${img(p.foto, 9, p.nombre, 300, "42vw")}<span>${esc(p.nombre)}</span><b>Bs ${esc(p.precio)}</b></a>`).join("");
    $("fila").querySelectorAll("a").forEach(a => a.onclick = () => { if (filtro !== "Todo") { filtro = "Todo"; pintarFiltros(); pintar(); } });
  }

  function pintarFiltros() {
    const cats = ["Todo", ...new Set(productos.map(p => p.categoria))];
    if (!cats.includes(filtro)) filtro = "Todo";
    $("filtros").innerHTML = cats.length > 2 ? cats.map(c => `<button type="button" aria-pressed="${c === filtro}">${esc(c)}</button>`).join("") : "";
    $("filtros").querySelectorAll("button").forEach((b, i, all) => b.onclick = () => {
      filtro = cats[i];
      all.forEach(x => x.setAttribute("aria-pressed", x === b));
      b.scrollIntoView({ inline: "nearest", block: "nearest" });
      const c = $("catalogo");
      if (scrollY > c.offsetTop - 72) c.scrollIntoView();
      pintar();
      c.animate(quieto() ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, translate: "0 6px" }, { opacity: 1, translate: "0" }],
        { duration: 200, easing: "cubic-bezier(.23,1,.32,1)" });
    });
  }

  function pintar() {
    const lista = productos.map((p, i) => [p, i]).filter(([p]) => filtro === "Todo" || p.categoria === filtro);
    $("catalogo").innerHTML = lista.map(([p, i], n) => {
      const d = p.ok && p.foto && n % 7 === 4;
      return `
      <article id="p${i}" class="${p.ok ? "" : "agotado"}${d ? " destacado" : ""}">
        <div class="img">${p.ok ? (p.nuevo ? '<span class="tag">Nuevo</span>' : "") : '<span class="tag">Agotado</span>'}${img(p.foto, n, p.nombre, d ? 800 : 400)}</div>
        <h2>${esc(p.nombre)}</h2>
        ${p.precio ? `<div class="precio"><small>Bs</small> ${esc(p.precio)}</div>` : ""}
        ${p.ok ? `
          ${p.tallas.length ? `<div class="tallas" role="radiogroup" aria-label="Talla de ${esc(p.nombre)}">${p.tallas.map(t =>
            `<label><input type="radio" name="t${i}" value="${esc(t)}"><span>${esc(t)}</span></label>`).join("")}</div>` : ""}
          <button class="add" type="button" data-i="${i}">Agregar a la bolsa</button>`
        : `<a class="avisar" href="${wa(`Hola! ¿Me avisan cuando vuelva ${p.nombre}?`)}" target="_blank" rel="noopener">Avisame cuando vuelva</a>`}
      </article>`;
    }).join("") || `<p class="estado">No hay productos en esta categoría.</p>`;
    $("catalogo").querySelectorAll(".add").forEach(b => b.onclick = () => agregar(b));
  }

  function agregar(b) {
    const p = productos[b.dataset.i];
    const art = b.closest("article");
    const sel = art.querySelector("input:checked");
    clearTimeout(b._t);
    if (p.tallas.length && !sel) {
      b.textContent = "Elegí una talla";
      navigator.vibrate?.([8, 40, 8]);
      if (!quieto()) art.querySelector(".tallas")?.animate([{ translate: "0" }, { translate: "-4px" }, { translate: "4px" }, { translate: "0" }], { duration: 220, easing: "ease-out" });
      b._t = setTimeout(() => b.textContent = "Agregar a la bolsa", 1600);
      return;
    }
    const yaVisible = $("barra").classList.contains("on");
    bolsa.push({ nombre: p.nombre, precio: p.precio, talla: sel?.value || "", foto: p.foto });
    navigator.vibrate?.(10);
    b.textContent = "✓ Agregado"; b.classList.add("ok");
    b._t = setTimeout(() => { b.textContent = "Agregar a la bolsa"; b.classList.remove("ok"); }, 1400);
    pintarBolsa();
    if (yaVisible && !quieto())
      $("barra").firstChild.animate([{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 260, easing: "cubic-bezier(.23,1,.32,1)" });
  }

  const num = s => parseFloat(String(s).replace(/\./g, "").replace(",", ".")) || 0;
  const total = () => bolsa.reduce((s, p) => s + num(p.precio), 0);

  function pintarBolsa() {
    const n = bolsa.length, t = total();
    $("barra").classList.toggle("on", n > 0);
    $("barra").innerHTML = `<span>Ver pedido (${n})</span><span>Bs ${t.toLocaleString("es-BO")}</span>`;
    $("items").innerHTML = bolsa.map((p, i) => `<div class="item">${img(p.foto, 9, "", 120, "48px")}
      <span>${esc(p.nombre)}${p.talla ? ` · talla ${esc(p.talla)}` : ""}<br><b>Bs ${esc(p.precio)}</b></span>
      <button type="button" aria-label="Quitar ${esc(p.nombre)}" data-i="${i}">×</button></div>`).join("");
    $("items").querySelectorAll("button").forEach(b => b.onclick = () => {
      navigator.vibrate?.(10);
      bolsa.splice(b.dataset.i, 1); pintarBolsa();
      if (!bolsa.length) $("bolsa").close();
    });
    $("total").textContent = `Bs ${t.toLocaleString("es-BO")}`;
  }

  $("barra").onclick = () => $("bolsa").showModal();
  $("cerrar").onclick = () => $("bolsa").close();
  $("bolsa").onclick = e => { if (e.target === $("bolsa")) $("bolsa").close(); };
  $("enviar").onclick = () => {
    const lineas = bolsa.map(p => `• ${p.nombre}${p.talla ? ` — talla ${p.talla}` : ""} — Bs ${p.precio}`).join("\n");
    window.open(wa(`Hola! Quiero hacer este pedido:\n${lineas}\nTotal: Bs ${total().toLocaleString("es-BO")}`), "_blank", "noopener");
  };

  async function cargar(url) {
    const r = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(r.status);
    const t = await r.text();
    if (/^\s*</.test(t)) throw new Error("La hoja no está publicada como CSV");
    const p = limpiar(parseCSV(t));
    if (!p.length) throw new Error("Hoja vacía");
    return [p, t];
  }

  function mostrar(lista) { productos = lista; pintarHero(); pintarNuevo(); pintarFiltros(); pintar(); }

  (async () => {
    pintarTienda();
    // Visitas repetidas: muestra al instante la última copia buena y después actualiza
    let guardado; try { guardado = localStorage.getItem("catalogo"); } catch {}
    if (guardado) mostrar(limpiar(parseCSV(guardado)));
    else $("catalogo").innerHTML = Array(6).fill('<article class="sk"><div class="img"></div></article>').join("");
    try {
      const [p, t] = await cargar(TIENDA.hoja);
      try { localStorage.setItem("catalogo", t); } catch {}
      mostrar(p);
    } catch {
      if (guardado) return;
      try { mostrar((await cargar("productos.csv"))[0]); }
      catch {
        $("filtros").innerHTML = "";
        $("catalogo").innerHTML = `<p class="estado">No pudimos cargar el catálogo.<br><a href="${wa("Hola! Quiero ver el catálogo")}" target="_blank" rel="noopener">Escribinos por WhatsApp</a></p>`;
      }
    }
  })();
</script>
</body>
</html>
