<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moda Santa Cruz — Catálogo</title>
<meta name="description" content="Catálogo de ropa en Santa Cruz. Pedí por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --ink: #1f1a17; --muted: #7a6f66; --line: #e7dfd4;
    --card: #fff; --accent: #8a5a3b; --wa: #1f9d55; --off: #b9b0a6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font: 600 clamp(28px, 6vw, 44px)/1.1 Fraunces, serif; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  nav { display: flex; gap: 8px; overflow-x: auto; padding: 16px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; border-radius: 999px; font: 500 14px Inter, sans-serif; white-space: nowrap; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 16px 48px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 700px) { main { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; } }
  article { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); }
  .img { position: relative; aspect-ratio: 3/4; background: var(--line); }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; font: 600 11px Inter; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .agotado .img img { filter: grayscale(1); opacity: .55; }
  .agotado .tag { background: var(--off); }
  .info { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  h2 { font: 500 15px/1.3 Inter; margin: 0; }
  .precio { font: 600 18px Fraunces, serif; }
  .tallas { display: flex; gap: 4px; flex-wrap: wrap; }
  .tallas span { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
  .pedir { margin-top: auto; display: block; text-align: center; background: var(--wa); color: #fff; text-decoration: none; font: 600 14px Inter; padding: 10px; border-radius: 10px; }
  .agotado .pedir { background: var(--off); pointer-events: none; }
  .estado { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
</style>
</head>
<body>
<header>
  <h1>Moda Santa Cruz</h1>
  <p class="sub">Ropa para todos los días y para tus noches de gala. Elegí y pedí por WhatsApp.</p>
</header>
<nav id="filtros" aria-label="Categorías"></nav>
<main id="catalogo"><p class="estado">Cargando catálogo…</p></main>
<footer>Envíos a toda Bolivia · Santa Cruz de la Sierra</footer>

<script>
  // El dueño edita esta hoja de Google; la página lee su versión publicada en CSV.
  const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVaUS1cnCyNBkceOIoGh_RS53NkUL2BzYqZ8KGrwtG15SBCZ7WOsnFcn8GWIMAHqbL9sNJ7Ghwv5ki/pub?output=csv";
  const WHATSAPP = "12516430051"; // número con código de país, ej. 59170000000

  // ponytail: parser CSV mínimo (comillas y comas), suficiente para lo que exporta Google Sheets
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const [head, ...data] = rows.filter(r => r.some(v => v.trim()));
    const keys = head.map(h => h.trim().toLowerCase());
    return data.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] || "").trim()])));
  }

  const si = v => /^(si|sí|x|1|true)$/i.test(v);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let productos = [], filtro = "Todo";

  function pintar() {
    const lista = productos.filter(p => filtro === "Todo" || p.categoria === filtro);
    document.getElementById("catalogo").innerHTML = lista.map(p => {
      const ok = si(p.disponible);
      const msg = `Hola! Me interesa: ${p.nombre} (Bs ${p.precio}). ¿Qué tallas tienen?`;
      const tag = !ok ? "Agotado" : si(p.nuevo) ? "Nuevo" : "";
      return `<article class="${ok ? "" : "agotado"}">
        <div class="img">${tag ? `<span class="tag">${tag}</span>` : ""}
          <img src="${esc(p.foto)}" alt="${esc(p.nombre)}" loading="lazy"></div>
        <div class="info">
          <h2>${esc(p.nombre)}</h2>
          <div class="precio">Bs ${esc(p.precio)}</div>
          <div class="tallas">${p.tallas.split(/[\s,]+/).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join("")}</div>
          <a class="pedir" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">${ok ? "Pedir por WhatsApp" : "Agotado"}</a>
        </div></article>`;
    }).join("") || `<p class="estado">No hay productos en esta categoría.</p>`;
  }

  function pintarFiltros() {
    const cats = ["Todo", ...new Set(productos.map(p => p.categoria).filter(Boolean))];
    const nav = document.getElementById("filtros");
    nav.innerHTML = cats.map(c => `<button aria-pressed="${c === filtro}">${esc(c)}</button>`).join("");
    nav.querySelectorAll("button").forEach((b, i) => b.onclick = () => { filtro = cats[i]; pintarFiltros(); pintar(); });
  }

  async function cargar(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return parseCSV(await r.text()).filter(p => p.nombre);
  }

  (async () => {
    try { productos = SHEET_CSV ? await cargar(SHEET_CSV) : await cargar("productos.csv"); }
    catch { productos = await cargar("productos.csv").catch(() => []); }
    pintarFiltros(); pintar();
  })();
</script>
</body>
</html>
